name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Blather.xcodeproj \
            -scheme Blather \
            -configuration Debug \
            -destination "platform=macOS" \
            -only-testing:BlatherTests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO
