name: Blather
options:
  bundleIdPrefix: com.blather
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0

settings:
  base:
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: SFK76D5YXM
    CODE_SIGN_STYLE: Automatic
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Blather:
    type: application
    platform: macOS
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Sparkle
        product: Sparkle
    sources:
      - path: Blather
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blather.app
        PRODUCT_NAME: Blather
        PRODUCT_MODULE_NAME: Blather
        INFOPLIST_KEY_CFBundleDisplayName: Blather
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Blather/Resources/Blather.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: Blather/Resources/Info.plist
      properties:
        CFBundleDisplayName: Blather
        CFBundleName: Blather
        CFBundleShortVersionString: "0.3.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        LSMultipleInstancesProhibited: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        SUFeedURL: https://kshehadeh.github.io/blather/appcast.xml
        SUEnableInstallerLauncherService: true
        SUPublicEDKey: "JXDN0gcZYfHx55Zlekm9KQGW7W4CuIP/7K14p41eO7k="
    scheme:
      testTargets:
        - BlatherTests
        - BlatherUITests
      gatherCoverageData: false

  BlatherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BlatherTests
    dependencies:
      - target: Blather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blather.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Blather.app/Contents/MacOS/Blather"
        BUNDLE_LOADER: "$(TEST_HOST)"

  BlatherUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: BlatherUITests
    dependencies:
      - target: Blather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blather.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Blather
