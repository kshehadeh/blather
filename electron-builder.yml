appId: com.blather.app
productName: Blather
icon: assets/blather-desktop-icon.icns
directories:
  output: release
files:
  - electron-dist/**
  - .next/**
  - public/**
  - next.config.ts
  - package.json
  - assets/blather-desktop-icon.png
asar: false
extraResources:
  - from: certificates
    to: certificates
    filter:
      - localhost.pem
      - localhost-key.pem
mac:
  target:
    - dmg
  category: public.app-category.productivity
publish: null
